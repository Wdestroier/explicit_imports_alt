name: explicit_imports_alt
version: 1.1.0
description: A Dart analyzer plugin that enforces explicit imports with configurable package exclusions.
repository: https://github.com/Wdestroier/explicit_imports_alt
topics:
  - analysis
  - analyzer
  - dart
  - imports
  - lint

environment:
  sdk: ^3.12.0

dependencies:
  analysis_server_plugin: ^0.3.24
  analyzer: ^14.5.0
  yaml: ^3.1.4

dev_dependencies:
  analyzer_testing: ^0.4.3
  lints: ^6.0.0
  test_reflective_loader: ^0.4.0
